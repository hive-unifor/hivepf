<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hive | Eventos de tecnologia no Ceará</title>
<!--
  Página teste "MVP". Não tem back-end: lê direto o data/eventos.json gerado
  por "python -m scraper.main". Para abrir, sirva a RAIZ do projeto:
      python -m http.server 8000
  e acesse http://localhost:8000/web/
-->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --azul: #0d3478;
    --cinza: #d9d9d9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Poppins", Arial, sans-serif;
    background: var(--cinza);
    color: var(--azul);
  }

  header {
    position: sticky;
    top: 0;
    height: 64px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.08);
  }
  header h1 { margin: 0; font-size: 30px; }
  #abrir-menu {
    position: absolute;
    left: 16px;
    width: 40px;
    height: 40px;
    padding: 8px;
    border: 0;
    background: none;
    cursor: pointer;
  }
  #abrir-menu span { display: block; height: 3px; margin: 5px 0; border-radius: 2px; background: var(--azul); }

  #fundo-menu { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.35); }
  #menu {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    width: min(300px, 85vw);
    padding: 20px;
    background: #fff;
    transform: translateX(-100%);
    transition: transform 0.2s;
  }
  .menu-aberto #menu { transform: none; }
  .menu-aberto #fundo-menu { display: block; }
  #menu h2 { margin: 4px 0 8px; font-size: 18px; }
  #menu label { display: block; margin: 16px 0 6px; font-size: 13px; font-weight: 600; }
  #menu input, #menu select {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid #c7c7c7;
    border-radius: 6px;
    font: inherit;
    font-size: 14px;
  }

  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 16px 40px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 22px;
  }

  .cartao {
    display: flex;
    flex-direction: column;
    padding: 10px 10px 16px;
    border-radius: 16px;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
  }
  .cartao img {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    border-radius: 12px;
    background: #ececec;
  }
  .cartao h3 { margin: 12px 6px 6px; font-size: 15px; line-height: 1.35; }
  .linha { display: flex; gap: 6px; margin: 0 6px 6px; font-size: 12px; font-weight: 500; }
  .linha svg { flex: none; width: 16px; height: 16px; fill: var(--azul); }
  .ver-mais {
    /* margin-top: auto joga o botão para o fim do cartão,
       deixando os botões da mesma fileira alinhados */
    margin: auto auto 0;
    width: 62%;
    padding: 8px 0;
    border: 0;
    border-radius: 6px;
    background: var(--azul);
    color: #fff;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }

  /* Popup de detalhes. O <dialog> já escurece o fundo e fecha com Esc. */
  #popup {
    width: min(920px, calc(100vw - 32px));
    max-height: calc(100vh - 32px);
    padding: 20px;
    border: 0;
    border-radius: 16px;
    background: var(--cinza);
    color: var(--azul);
  }
  #popup::backdrop { background: rgba(0, 0, 0, 0.5); }
  body:has(#popup[open]) { overflow: hidden; }
  #fechar {
    float: right;
    width: 36px;
    height: 36px;
    margin: -8px -8px 0 0;
    border: 0;
    background: none;
    color: var(--azul);
    font-size: 28px;
    line-height: 1;
    cursor: pointer;
  }
  .popup-topo { display: grid; grid-template-columns: 1fr 340px; gap: 16px; clear: both; }
  .caixa { padding: 18px 20px; border-radius: 14px; background: #fff; font-size: 13px; line-height: 1.55; }
  .caixa p { margin: 0 0 8px; }
  .caixa h2 { margin: 0 0 10px; font-size: 26px; text-align: center; }
  .caixa h3 { margin: 0 0 8px; font-size: 15px; }
  .caixa .linha { margin: 0 0 6px; }
  .lado { display: flex; flex-direction: column; gap: 12px; }
  .lado img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 14px; background: #ececec; }
  .inscrever {
    display: block;
    padding: 12px 0;
    border-radius: 10px;
    background: var(--azul);
    color: #fff;
    text-align: center;
    text-decoration: none;
    font-weight: 600;
  }
  .fonte-popup { margin: 0; font-size: 12px; text-align: center; color: #555; }
  #p-resto { margin-top: 16px; }

  @media (max-width: 700px) {
    .popup-topo { grid-template-columns: 1fr; }
    .lado { order: -1; }  /* no celular, imagem e botão vêm primeiro */
    .caixa h2 { font-size: 20px; }
  }
  .detalhes { margin-bottom: 12px; }

  footer { padding: 0 16px 28px; text-align: center; font-size: 12px; color: #555; }
</style>
</head>
<body>

<header>
  <button id="abrir-menu" aria-label="Abrir menu"><span></span><span></span><span></span></button>
  <h1>Hive</h1>
</header>

<div id="fundo-menu"></div>
<div id="menu">
  <h2>Filtrar eventos</h2>
  <label for="busca">Buscar</label>
  <input id="busca" type="search" placeholder="Nome, local ou organizador">
  <label for="tipo">Tipo de evento</label>
  <select id="tipo">
    <option value="">Todos</option>
    <option value="hackathon">Hackathon</option>
    <option value="meetup">Meetup</option>
    <option value="conferencia">Conferência</option>
    <option value="workshop">Workshop</option>
    <option value="outro">Outro</option>
  </select>
  <label for="fonte">Fonte</label>
  <select id="fonte">
    <option value="">Todas</option>
    <option value="sympla">Sympla</option>
    <option value="gdg">GDG Fortaleza</option>
    <option value="doity">Doity</option>
    <option value="unifor">Unifor</option>
  </select>
</div>

<main id="lista"></main>
<footer id="rodape"></footer>

<dialog id="popup">
  <button id="fechar" aria-label="Fechar">&times;</button>
  <div class="popup-topo">
    <section class="caixa">
      <h2>Descrição do evento</h2>
      <h3 id="p-titulo"></h3>
      <div class="linha"><span id="p-data"></span></div>
      <div class="linha" id="p-linha-local"><span id="p-local"></span></div>
      <div id="p-resumo"></div>
    </section>
    <div class="lado">
      <img id="p-imagem" alt="">
      <a id="p-inscrever" class="inscrever" target="_blank" rel="noopener">Inscrever-se</a>
      <p class="fonte-popup" id="p-fonte"></p>
    </div>
  </div>
  <section class="caixa" id="p-resto"></section>
</dialog>

<script>
  const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];

  const ICONE_DATA = '<svg viewBox="0 0 24 24"><path d="M7 2h2v2h6V2h2v2h3a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3V2zm12 8H5v9h14v-9z"/></svg>';
  const ICONE_LOCAL = '<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 1 7 7c0 5.2-7 13-7 13S5 14.2 5 9a7 7 0 0 1 7-7zm0 4.5A2.5 2.5 0 1 0 12 11.5 2.5 2.5 0 0 0 12 6.5z"/></svg>';

  let eventos = [];

  // "2026-10-17T08:00:00-03:00" -> "17 out - 2026 • 08:00"
  // A coleta já salva no horário do Ceará, então basta recortar o texto.
  // 00:00 quer dizer que a fonte não informou o horário, então ele não aparece.
  function formatarData(texto) {
    const [data, hora] = texto.split("T");
    const [ano, mes, dia] = data.split("-");
    const horario = hora.slice(0, 5) === "00:00" ? "" : ` • ${hora.slice(0, 5)}`;
    return `${dia} ${MESES[mes - 1]} - ${ano}${horario}`;
  }

  // Os textos vêm de outros sites; escapar evita que algum título injete HTML.
  function esc(texto) {
    const div = document.createElement("div");
    div.textContent = texto || "";
    return div.innerHTML;
  }

  function periodo(e) {
    return e.fim ? formatarData(e.inicio) + " > " + formatarData(e.fim) : formatarData(e.inicio);
  }

  function cartao(e) {
    const local = e.local || e.cidade;
    return `
      <article class="cartao">
        <img src="${esc(e.imagem)}" alt="" loading="lazy">
        <div class="detalhes">
          <h3>${esc(e.titulo)}</h3>
          <div class="linha">${ICONE_DATA}<span>${periodo(e)}</span></div>
          ${local ? `<div class="linha">${ICONE_LOCAL}<span>${esc(local)}</span></div>` : ""}
        </div>
        <button class="ver-mais" data-indice="${eventos.indexOf(e)}">Ver mais &rsaquo;</button>
      </article>`;
  }

  const NOMES_FONTE = { sympla: "Sympla", gdg: "GDG Fortaleza", doity: "Doity", unifor: "Unifor" };

  function paragrafos(linhas) {
    return linhas.map((linha) => `<p>${esc(linha)}</p>`).join("");
  }

  function abrirPopup(e) {
    document.getElementById("p-titulo").textContent = e.titulo;
    document.getElementById("p-data").textContent = periodo(e);
    document.getElementById("p-local").textContent = e.local || e.cidade || "";
    document.getElementById("p-linha-local").hidden = !(e.local || e.cidade);
    document.getElementById("p-imagem").src = e.imagem || "";
    document.getElementById("p-inscrever").href = e.url_inscricao || e.url;
    document.getElementById("p-fonte").textContent = "Divulgado por " + (NOMES_FONTE[e.fonte] || e.fonte);

    // Muitas descrições começam repetindo o título; essa linha sai.
    let linhas = (e.descricao || "").split("\n").filter((l) => l && l !== e.titulo);

    // O começo do texto (até uns 400 caracteres) fica na caixa de cima,
    // ao lado da imagem; o restante vai para a caixa de baixo, como no mockup.
    let corte = 0, tamanho = 0;
    while (corte < linhas.length && (corte === 0 || tamanho + linhas[corte].length <= 400)) {
      tamanho += linhas[corte].length;
      corte++;
    }
    document.getElementById("p-resumo").innerHTML = linhas.length
      ? paragrafos(linhas.slice(0, corte))
      : "<p>Mais detalhes no site do evento.</p>";

    const resto = document.getElementById("p-resto");
    resto.innerHTML = paragrafos(linhas.slice(corte));
    resto.hidden = linhas.length <= corte;

    document.getElementById("popup").showModal();
    document.getElementById("popup").scrollTop = 0;
  }

  function mostrar() {
    const busca = document.getElementById("busca").value.toLowerCase();
    const tipo = document.getElementById("tipo").value;
    const fonte = document.getElementById("fonte").value;

    const filtrados = eventos.filter((e) => {
      const texto = [e.titulo, e.local, e.organizador].join(" ").toLowerCase();
      return (!tipo || e.tipo === tipo) && (!fonte || e.fonte === fonte) && texto.includes(busca);
    });

    document.getElementById("lista").innerHTML = filtrados.length
      ? filtrados.map(cartao).join("")
      : "<p>Nenhum evento encontrado.</p>";
  }

  async function carregar() {
    const resposta = await fetch("../data/eventos.json", { cache: "no-store" });
    eventos = await resposta.json();

    // Esconde o que já terminou, caso o eventos.json seja de uma coleta antiga.
    // Compara só o dia (formato "2026-11-24" no horário de Fortaleza), como a
    // fonte Unifor: evento sem horário de fim continua aparecendo no próprio dia.
    const hoje = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Fortaleza" }).format(new Date());
    eventos = eventos.filter((e) => (e.fim || e.inicio).slice(0, 10) >= hoje);

    eventos.sort((a, b) => a.inicio.localeCompare(b.inicio));

    const coleta = eventos[0]?.coletado_em;
    if (coleta) document.getElementById("rodape").textContent = "Atualizado em " + formatarData(coleta);
    mostrar();
  }

  document.getElementById("busca").addEventListener("input", mostrar);
  document.getElementById("tipo").addEventListener("change", mostrar);
  document.getElementById("fonte").addEventListener("change", mostrar);
  document.getElementById("abrir-menu").addEventListener("click", () => document.body.classList.add("menu-aberto"));
  document.getElementById("fundo-menu").addEventListener("click", () => document.body.classList.remove("menu-aberto"));

  document.getElementById("p-data").insertAdjacentHTML("beforebegin", ICONE_DATA);
  document.getElementById("p-local").insertAdjacentHTML("beforebegin", ICONE_LOCAL);

  // Um só "ouvinte" na lista atende todos os botões "Ver mais", até os que
  // forem desenhados de novo depois de filtrar.
  document.getElementById("lista").addEventListener("click", (ev) => {
    const botao = ev.target.closest(".ver-mais");
    if (botao) abrirPopup(eventos[botao.dataset.indice]);
  });
  const popup = document.getElementById("popup");
  document.getElementById("fechar").addEventListener("click", () => popup.close());
  // Clique fora da janela (no fundo escuro) também fecha.
  popup.addEventListener("click", (ev) => {
    const r = popup.getBoundingClientRect();
    const fora = ev.clientX < r.left || ev.clientX > r.right || ev.clientY < r.top || ev.clientY > r.bottom;
    if (fora) popup.close();
  });

  carregar();
</script>
</body>
</html>
